<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Fieldnotes — Android kit preview</title><style>
:root{--paper:#f4f0e8;--ink:#262724;--muted:#76756e;--line:#d7d0c5;--accent:#d65b3f;--white:#fff;--wash:#e8e2d8}*{box-sizing:border-box}body{margin:0;background:#d6d0c5;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;min-height:100vh;place-items:center}.device{width:min(420px,100vw);height:min(860px,100dvh);background:var(--paper);border:8px solid #222;border-radius:32px;overflow:hidden;box-shadow:0 26px 90px #29251f55;position:relative}.status{height:30px;padding:7px 18px 0;font-size:11px;font-weight:650;display:flex;justify-content:space-between}.app{height:calc(100% - 30px);overflow-y:auto;padding:14px 22px 34px;scrollbar-width:thin}.eyebrow{color:var(--accent);font-size:10px;font-weight:800;letter-spacing:.16em;margin:4px 0 11px}.title{font:34px/1.08 Georgia,serif;letter-spacing:-.6px;margin:0 0 7px}.sub{font-size:13px;color:var(--muted);line-height:1.5;margin:0 0 18px}.rule{height:1px;background:var(--line);margin:16px 0}.block{margin:14px 0}.label{font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.12em;margin:14px 0 7px}.row,.tile,.result,.question{background:var(--white);border-radius:9px;padding:14px;margin:9px 0}.tile{display:flex;align-items:center;justify-content:space-between;font-size:17px;font-weight:700;cursor:pointer;padding:19px 15px;transition:transform .18s,background .18s}.tile:active,button:active{transform:scale(.98)}button{border:0;background:var(--accent);color:white;font-size:14px;font-weight:700;padding:13px 16px;border-radius:9px;cursor:pointer;transition:transform .18s;width:100%;margin:5px 0}button.secondary{background:var(--wash);color:var(--ink)}button.small{width:auto;padding:9px 12px;margin:4px 3px 0 0}input,select{font:15px system-ui;color:var(--ink);border:1px solid transparent;background:var(--white);border-radius:9px;width:100%;padding:13px;margin:4px 0;outline:none}input:focus,select:focus{border-color:var(--accent)}.actions{display:flex;gap:7px}.actions button{flex:1}.feedback{font-size:13px;color:var(--muted);min-height:20px;margin:8px 0}.big{font-size:38px;font-weight:730;letter-spacing:-1px}.muted{color:var(--muted);font-size:13px}.task{display:flex;gap:10px;align-items:flex-start;background:white;padding:12px;border-radius:9px;margin:8px 0}.task strong{display:block;overflow-wrap:anywhere}.task small{display:block;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}.task.done strong{text-decoration:line-through;color:var(--muted)}.task button{width:auto;margin:0;padding:8px 10px}.task .taskinfo{flex:1;min-width:0}.answer{display:block;background:white;padding:12px;border-radius:8px;margin:8px 0;cursor:pointer}.answer.correct{background:#dcebdd;color:#275c35}.answer.wrong{background:#f6dfd7;color:#893b2c}.calcdisplay{background:white;border-radius:9px;padding:20px 14px;text-align:right;font-size:29px;min-height:68px;overflow:hidden;overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:8px 0}.grid button{margin:0;background:var(--wash);color:var(--ink);font-size:17px;padding:15px 0}.grid button.operator{background:#ead9ce;color:#773a2d}.grid button.equal{background:var(--accent);color:white}.note{border-top:1px solid var(--line);padding:11px 0;margin-top:14px;font-size:10px;line-height:1.4;color:var(--muted)}.homefoot{font-size:11px;color:var(--muted);margin:18px 0}.hidden{display:none!important}.tag{font-size:10px;color:var(--muted);font-weight:650}.laps{border-bottom:1px solid var(--line);padding:9px 2px;font-variant-numeric:tabular-nums}.inline{display:flex;gap:8px}.inline>*{flex:1}
</style></head><body><div class="device"><div class="status"><span>9:41</span><span>FIELDNOTES　●●●　▰</span></div><main id="app" class="app"></main></div><script>
const root=document.querySelector('#app');let current='home',calc='',quiz={order:[],i:0,score:0,answered:false},watch={elapsed:0,base:0,running:false,laps:[]};const units={Length:[['Metres',1],['Centimetres',.01],['Kilometres',1000],['Miles',1609.344],['Feet',.3048],['Inches',.0254]],Mass:[['Kilograms',1],['Grams',.001],['Pounds',.45359237],['Ounces',.028349523125]],Volume:[['Litres',1],['Millilitres',.001],['US gallons',3.785411784],['Cups',.2365882365]],Temperature:[['Celsius',0],['Fahrenheit',1],['Kelvin',2]]};const questions=[['Which planet is known as the Red Planet?',['Venus','Mars','Jupiter','Mercury'],1],['What is the largest ocean?',['Atlantic','Indian','Pacific','Arctic'],2],['How many sides has a hexagon?',['Five','Six','Seven','Eight'],1],['What is the chemical symbol for gold?',['Ag','Go','Gd','Au'],3],['Which gas do plants absorb?',['Oxygen','Carbon dioxide','Nitrogen','Hydrogen'],1],['What is the capital of Japan?',['Kyoto','Osaka','Tokyo','Sapporo'],2],['Which animal is a mammal?',['Shark','Dolphin','Trout','Octopus'],1],['How many minutes are in two hours?',['100','110','120','140'],2],['Which is the closest star to Earth?',['Sirius','The Sun','Proxima Centauri','Vega'],1],['What is the largest land animal?',['Giraffe','African elephant','Polar bear','Hippopotamus'],1]];
function shell(no,title,sub,body){root.innerHTML=`<div class="eyebrow">${no}</div><h1 class="title">${title}</h1><p class="sub">${sub}</p><div class="rule"></div>${body}<div class="note">INTERACTIVE BROWSER PREVIEW · Not the compiled Android app. Task data here uses browser storage; Android version uses SQLite.</div>`}function btn(t,fn,cls=''){return `<button class="${cls}" onclick="${fn}">${t}</button>`}function back(){return btn('←　Studio index',`go('home')`,'secondary')}
function go(where){current=where;({home,converter,todo,calculator,quizHome,stopwatch}[where])()}function home(){shell('FIELDNOTES　/　ANDROID KIT','Five useful instruments','OIBSIP · JAVA + XML · LOCAL-FIRST',`<p class="muted">A small field kit, not one app pretending to be five.</p>${[['01','Unit converter','converter'],['02','To-do / sign in','todo'],['03','Calculator','calculator'],['04','General knowledge quiz','quizHome'],['05','Stopwatch / laps','stopwatch']].map(([n,t,id])=>`<div class="tile" onclick="go('${id}')"><span>${n}　${t}</span><span>↗</span></div>`).join('')}`)}
function converter(){shell('01　/　MEASURE','Unit converter','Four categories · precise factors · no network needed',`<div class="label">MEASUREMENT</div><select id="cat" onchange="setUnitOptions()">${Object.keys(units).map(x=>`<option>${x}</option>`)}</select><div class="label">VALUE</div><input id="amount" type="number" step="any" placeholder="e.g. 12.5"><div class="label">FROM / TO</div><select id="from"></select><select id="to"></select><div id="convout" class="result muted">Result appears here</div><div class="actions">${btn('Swap units','swapUnits()','secondary')}${btn('Convert','convertNow()')}</div><div id="convmsg" class="feedback"></div>${back()}`);setUnitOptions()}function setUnitOptions(){let cat=document.querySelector('#cat')?.value;if(!cat)return;for(const id of ['from','to'])document.querySelector('#'+id).innerHTML=units[cat].map(([n])=>`<option>${n}</option>`).join('');document.querySelector('#to').selectedIndex=Math.min(1,units[cat].length-1)}function swapUnits(){let a=document.querySelector('#from'),b=document.querySelector('#to'),x=a.selectedIndex;a.selectedIndex=b.selectedIndex;b.selectedIndex=x}function convertNow(){let raw=document.querySelector('#amount').value,msg=document.querySelector('#convmsg');if(raw.trim()===''||!Number.isFinite(Number(raw))){msg.textContent='Enter a valid number to convert.';return}let cat=document.querySelector('#cat').value,f=document.querySelector('#from').selectedIndex,t=document.querySelector('#to').selectedIndex,x=Number(raw),res;if(cat==='Temperature'){let k=f===0?x+273.15:f===1?(x-32)*5/9+273.15:x;res=t===0?k-273.15:t===1?(k-273.15)*9/5+32:k}else res=x*units[cat][f][1]/units[cat][t][1];document.querySelector('#convout').innerHTML=`<strong>${Number(res.toPrecision(9))} ${units[cat][t][0]}</strong>`;msg.textContent='Conversion complete.'}
function tasks(){return JSON.parse(localStorage.getItem('fn_tasks')||'[]')}function saveTasks(x){localStorage.setItem('fn_tasks',JSON.stringify(x))}function todo(){let signed=localStorage.getItem('fn_user'),list=tasks();if(!signed){shell('02　/　PERSONAL LISTS','Your account','Browser preview account · use a demo email and password',`<div class="label">SIGN IN</div><input id="email" placeholder="Email address"><input id="password" type="password" placeholder="Password"><div id="authmsg" class="feedback"></div>${btn('Sign in','signIn()')}${btn('Create a local demo account','registerDemo()','secondary')}${back()}`);return}shell('02　/　PERSONAL LISTS','Hello, '+escapeHtml(signed),'Your preview list is stored in this browser.',`${btn('＋　Add a task','addTask()')}${btn('Sign out','signOut()','secondary')}${list.filter(t=>t.owner===signed).map((t)=>`<div class="task ${t.done?'done':''}"><div class="taskinfo"><strong>${t.done?'✓　':'○　'}${escapeHtml(t.title)}</strong>${t.note?`<small>${escapeHtml(t.note)}</small>`:''}</div><button class="secondary" onclick="toggleTask(${t.id})">${t.done?'Reopen':'Done'}</button><button class="secondary" onclick="deleteTask(${t.id})">×</button></div>`).join('')||'<div class="result muted">Nothing on the list yet. Add one small next step.</div>'}${back()}`)}function registerDemo(){let e=document.querySelector('#email').value.trim(),p=document.querySelector('#password').value;if(!e.includes('@')||p.length<4){document.querySelector('#authmsg').textContent='Use an email and a 4+ character preview password.';return}localStorage.setItem('fn_user',e);todo()}function signIn(){let e=document.querySelector('#email').value.trim();if(!e){document.querySelector('#authmsg').textContent='Enter your demo email address.';return}if(!localStorage.getItem('fn_user')){document.querySelector('#authmsg').textContent='Create a preview account first.';return}if(localStorage.getItem('fn_user')!==e){document.querySelector('#authmsg').textContent='No preview account for this email.';return}localStorage.setItem('fn_user',e);todo()}function signOut(){localStorage.removeItem('fn_user');todo()}function addTask(){let title=prompt('Task name');if(title===null)return;if(!title.trim()){alert('A task needs a name.');return}let note=prompt('Optional notes')||'',x=tasks();x.push({id:Date.now(),owner:localStorage.getItem('fn_user'),title:title.trim(),note,done:false});saveTasks(x);todo()}function toggleTask(id){let x=tasks();x.forEach(t=>{if(t.id===id)t.done=!t.done});saveTasks(x);todo()}function deleteTask(id){saveTasks(tasks().filter(t=>t.id!==id));todo()}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function calculator(){shell('03　/　ARITHMETIC','Calculator','A small arithmetic instrument · multiplication before addition',`<div class="calcdisplay" id="calcdisp">${calc||'0'}</div><div class="grid">${['7','8','9','÷','4','5','6','×','1','2','3','−','C','0','.','+','⌫','='].map(k=>`<button class="${'+−×÷'.includes(k)?'operator':''} ${k==='='?'equal':''}" onclick="calcTap('${k}')">${k}</button>`).join('')}</div>${back()}`)}function calcTap(k){let d=document.querySelector('#calcdisp');if(k==='C')calc='';else if(k==='⌫')calc=calc.slice(0,-1);else if(k==='='){try{let s=calc.replaceAll('×','*').replaceAll('÷','/').replaceAll('−','-');if(!/^[\d.+*/()\- ]+$/.test(s)||!s.trim())throw 0;let r=Function('"use strict";return ('+s+')')();if(!Number.isFinite(r))throw 0;calc=String(r)}catch{calc='Error'}}else{if(calc==='Error')calc='';if('÷×+−'.includes(k)&&/[+*/-]$/.test(calc))calc=calc.slice(0,-1);calc+=k}if(d)d.textContent=calc||'0'}
function quizHome(){shell('04　/　GENERAL KNOWLEDGE','Ten questions. One run.','Questions are shuffled each time. No timer; think it through.',`${btn('Start quiz','startQuiz()')}${back()}`)}function startQuiz(){quiz.order=questions.map((_,i)=>i).sort(()=>Math.random()-.5);quiz.i=0;quiz.score=0;quiz.answered=false;showQuestion()}function showQuestion(){let q=questions[quiz.order[quiz.i]];shell(`04　/　QUESTION ${quiz.i+1} OF 10`,'Choose one answer',`Score so far: ${quiz.score} correct`, `<div class="question"><strong>${q[0]}</strong></div>${q[1].map((a,i)=>`<div class="answer" id="answer${i}" onclick="answerQuiz(${i})">${a}</div>`).join('')}<div class="feedback" id="qfeedback">Select an answer to see feedback.</div>${btn(quiz.i===9?'See results':'Next question','nextQuestion()')}`)}function answerQuiz(i){if(quiz.answered)return;quiz.answered=true;let q=questions[quiz.order[quiz.i]],correct=q[2];document.querySelector('#answer'+correct).classList.add('correct');if(i===correct){quiz.score++;document.querySelector('#qfeedback').textContent='Correct. Nice recall.'}else{document.querySelector('#answer'+i).classList.add('wrong');document.querySelector('#qfeedback').textContent='Not quite. The answer is '+q[1][correct]+'.'}}function nextQuestion(){if(!quiz.answered){document.querySelector('#qfeedback').textContent='Choose an answer first.';return}if(++quiz.i>=10){shell('04　/　YOUR RESULT','Run complete','A quick measure of what stuck',`<div class="big" style="color:var(--accent)">${quiz.score} / 10</div><p>Correct: ${quiz.score}　 Incorrect: ${10-quiz.score}</p>${btn('Restart · reshuffle','startQuiz()')}${back()}`)}else{quiz.answered=false;showQuestion()}}
function timeNow(){return watch.running?performance.now()-watch.base:watch.elapsed}function fmt(ms){let x=Math.max(0,ms|0),cs=Math.floor(x/10)%100,s=Math.floor(x/1000)%60,m=Math.floor(x/60000)%60,h=Math.floor(x/3600000);return [h,m,s,cs].map(v=>String(v).padStart(2,'0')).join(':')}function stopwatch(){shell('05　/　TIME','Stopwatch','Monotonic timing · laps recorded for this preview screen',`<div class="big" id="timer" style="text-align:center;padding:18px 0;font-variant-numeric:tabular-nums">${fmt(timeNow())}</div><div class="actions">${btn(watch.running?'Running':'Start / resume','toggleWatch()','secondary')}${btn('Pause','pauseWatch()','secondary')}${btn('Reset','resetWatch()','secondary')}</div>${btn('＋　Record lap','lapWatch()')}<div class="label">LAPS　/　${watch.laps.length}</div>${watch.laps.map((v,i)=>`<div class="laps">${String(watch.laps.length-i).padStart(2,'0')}　${v}</div>`).reverse().join('')}${back()}`)}function updateWatch(){let t=document.querySelector('#timer');if(t){t.textContent=fmt(timeNow());requestAnimationFrame(updateWatch)}}function toggleWatch(){if(!watch.running){watch.base=performance.now()-watch.elapsed;watch.running=true;stopwatch();requestAnimationFrame(updateWatch)}}function pauseWatch(){if(watch.running){watch.elapsed=timeNow();watch.running=false;stopwatch()}}function resetWatch(){watch.running=false;watch.elapsed=0;watch.laps=[];stopwatch()}function lapWatch(){if(!watch.running){alert('Start the stopwatch before recording a lap.');return}watch.laps.push(fmt(timeNow()));stopwatch();requestAnimationFrame(updateWatch)}document.addEventListener('visibilitychange',()=>{if(watch.running){watch.elapsed=timeNow();watch.base=performance.now()-watch.elapsed}});go('home');
</script></body></html>
